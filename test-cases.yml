- summary: |
    Успешный повторный запуск тестов во время игры
  requirement: |
    Во время игры пользователь может многократно запускать тесты своего решения
  prerequisites: |
    Пользователь авторизован
    Создана игра против бота
    Решение не принято как победа
    Игра не окончена
  test-data: |
   Код в редакторе неполный или неверный
  steps:
    - Запустить тесты кнопкой Run
    - Запустить тесты кнопкой Run еще раз
  expected-result: |
    Тесты не проходят
    Текущая игра продолжается
    Таймер продолжает отсчёт
    Кнопка Run кликабельна
    
