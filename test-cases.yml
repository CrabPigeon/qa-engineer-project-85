---
- summary: |
    Успешная регистрация на сайте через email
  requirement: |
    Пользователь может зарегистрироваться и войти через email, GitHub или Discord
  prerequisites: |
    Открыта главная страница https://codebattle.hexlet.io/
    Пользователь не авторизован в Codebatle
    Указанные email и nickname ещё не заняты
  test-data: |
    Nickname = testuser998
    Email = testuser999@gmail.com
    Password = Testpass321!
  steps:
    - Нажать кнопку Sign up
    - Ввести Nickname
    - Ввести Email
    - Ввести Password
    - Ввести подтверждение Password
    - Нажать кнопку Submit
  expected-result: |
    Пользователь зарегистрирован и авторизован на сайте

- summary: |
    Успешный вход на сайт через GitHub
  requirement: |
    Пользователь может зарегистрироваться и войти через email, GitHub или Discord
  prerequisites: |
    Открыта главная страница https://codebattle.hexlet.io/
    Пользователь не авторизован в Codebattle
    Есть аккаунт на https://github.com/
  test-data: |
    Профиль пользователя GitHub
  steps:
    - Нажать кнопку Sign up
    - Нажать кнопку Sign up with GitHub
    - Подтвердить доступ, если GitHub его запрашивает
  expected-result: |
    Пользователь авторизован через GitHub

