---
functional:
Пользователь должен иметь возможность создать игру с любым пользователем, с ботом или другом (игра будет доступна по ссылке)
Пользователь должен иметь возможность видеть редактор кода другого игрока и вывод тестов  во время решения
Пользователь должен иметь возможность менять язык программирования во время решения
non-functional:

implicit:

Решение задачи на скорость против другого игрока. Оба игрока видят друг у друга редактор с кодом,
вывод тестов, могут менять язык программирования во время решения

Можно выбрать игру по уровню сложности. При создании игры можно выбрать определенную игру, иначе она будет подобрана наугад
Задачи даны на двух языках — русском и английском
Другие пользователи могут следить за ходом игры
В игре есть чат, в котором общаются зарегистрированные пользователи
Завершенная игра доступна в записи. Редактор для ввода кода выглядит как проигрыватель
Пользователи получают очки, на основе которых строится рейтинг за неделю, месяц и за все время
