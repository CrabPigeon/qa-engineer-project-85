---
functional:
  - Пользователь может создать игру против бота, случайного игрока или друга по ссылке
  - Пользователь может выбирать уровень сложности или конкретную задачу
  - Если пользователь не выбрал конкретную задачу, система должна подобрать её случайно
  - Пользователь может видеть редактор кода соперника и вывод тестов во время игры
  - Пользователь может менять язык программирования во время решения
  - Другие пользователи могут следить за ходом игры
  - Завершённая игра должна быть доступна в записи
  - Зарегистрированные пользователи могут общаться в чате во время игры
  - Пользователи должны получать очки, на основе которых строится рейтинг за неделю, месяц и за всё время
  - Пользователь может авторизоваться через email, GitHub и Discord
  - Незарегистрированный пользователь может начать простую игру с ботом
  - Во время игры пользователь может многократно запускать тесты своего решения
  - Пользователь может сдаться до истечения времени
non-functional:
  - Сайт должен быть удобным в использовании и оптимизированным по скорости работы
  - Сайт должен быть безопасным и защищать данные пользователя
  - Сайт должен корректно работать на мобильных устройствах
  - Сайт должен корректно работать в последних версиях популярных браузеров
  - Сайт должен выдерживать высокую нагрузку (например, около 1000 одновременных пользователей)
  - Интерфейс и условия задач должны быть доступны на русском и английском языках
  - Изменения в редакторе и результаты тестов отображаются без перезагрузки страницы
implicit:
  - Во время игры есть ограничение по времени
  - Пользователю доступны записи завершенных игр
  - Оба игрока одновременно видят код друг друга
  - Игрок не может изменять код соперника
  - Зритель не может писать код за участников
  - Победа засчитывается только после успешного прохождения всех тестов

