---
functional:
Пользователь должен иметь возможность создать игру с любым пользователем, с ботом или другом (игра будет доступна по ссылке)
Пользователь должен иметь возможность видеть редактор кода другого игрока и вывод тестов  во время решения
Пользователь должен иметь возможность менять язык программирования во время решения
Пользователь должен иметь возможность выбирать сложность задач
Пользователь должен иметь возможность следить за ходом игры других пользователей
Завершенные игры должны быть доступны в записи
non-functional:
Сайт должен быть разработан с учетом удобства использования и оптимизирован для скорости работы
Сайт должен быть безопасным и защищать данные пользователя
Сайт должен быть удобным на мобильном устройстве
Сайт должен быть протестирован на совместимость с последними версиями браузеров
Сайт должен быть способен обрабатывать большое количество трафика (например, 1000 одновременных пользователей)
Сайт должен иметь локализацию (перевод) на русский и английский языки
implicit:
Редактор для ввода кода выглядит как проигрыватель
Оба игрока видят друг у друга редактор с кодом
Во вреемя игры зарегестрированным пользователям должен быть доступен чат
Пользователи получают очки, на основе которых строится рейтинг за неделю, месяц и за все время
Задачи решаются с таймером
Во время игры доступен вывод тестов и возможность менять язык программирования
Если пользователь не выбрал конкретную задачуЮ то задача выбирается наугад

. 

